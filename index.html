/* Assistance is visible as torque flow, not a fictitious steering ratio. */

#scene[data-assist=off] [data-electric-path]{display:none}#scene[data-assist=off] [data-stator]{filter:grayscale(1)}
#scene .torqueFlow{animation:none}#scene[data-assist=on][data-steering-moving=true] .torqueFlow{animation:assistTorqueTravel .55s linear infinite}#scene[data-assist-state=working] [data-motor-active-ring]{animation:assistMotorPulse .8s ease-in-out infinite}
@keyframes assistTorqueTravel{to{stroke-dashoffset:-13}}@keyframes assistMotorPulse{50%{stroke-opacity:.42}}
@media(prefers-reduced-motion:reduce){#scene .torqueFlow,#scene [data-motor-active-ring]{animation:none!important}}


/* Classroom typography: 24 px labels, larger primary values. */
:root{--classroom-type:24px;--classroom-value:32px;--classroom-title:28px}
body{font-size:var(--classroom-type);line-height:1.12}
.app-shell{grid-template-rows:58px minmax(0,1fr)}
.brand h1{font-size:var(--classroom-title)}
.header-actions button{font-size:var(--classroom-type);padding:4px 12px;line-height:1.12}
main{grid-template-rows:48px minmax(0,1fr);gap:8px;padding:8px 14px 10px}
.tab{font-size:var(--classroom-type);padding:5px 15px}.tab b{font-size:var(--classroom-title)}
.workspace{grid-template-columns:360px minmax(0,1fr);gap:18px}
.dashboard{padding-right:16px;gap:6px}
.wheelzone{min-height:132px;flex:1 1 200px}.wheelzone svg{max-height:290px}
.rangebox{gap:3px}.rangebox label{font-size:var(--classroom-type);line-height:1.12}

input[type=range]{height:26px}.limits{font-size:var(--classroom-type);line-height:1.05;font-weight:550}
.quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.quick button{font-size:var(--classroom-type);padding:4px 3px;line-height:1.12}
.quick button[data-angle="0"]{grid-column:1/-1;grid-row:2}
.architecture{padding-top:6px}.setting-title{font-size:var(--classroom-type);margin-bottom:6px;line-height:1.12}
.choicebar button{font-size:var(--classroom-type);padding:4px 6px;line-height:1.12}
.assistRow{padding:6px 0 0;gap:8px}.assistRow strong{font-size:var(--classroom-type);line-height:1.12;min-width:0}
.assistRow button{font-size:var(--classroom-type);padding:4px 8px;line-height:1.12;min-width:128px;flex:none}
.legend{font-size:var(--classroom-type);gap:3px 14px;padding-top:2px;line-height:1.12}
.legend span{white-space:nowrap}.legend i{width:16px;height:4px;margin-right:6px}
.viewer{grid-template-rows:36px minmax(0,1fr) 112px;gap:8px}
.viewhead h2{font-size:var(--classroom-title)}.viewhead small{font-size:var(--classroom-type)}
.readout{grid-template-columns:1fr 1.55fr 1.2fr 1.35fr;gap:12px;padding-top:8px}
.readout .metric:nth-child(2) strong{white-space:normal}
.metric small{font-size:var(--classroom-type);line-height:1.1;margin-bottom:7px}
.readout .metric strong{font-size:var(--classroom-value);line-height:1.08}
.toast{font-size:var(--classroom-type)}
/* SVG text is larger because it is fitted with the drawing, unlike HTML text. */
#scene .tiny{font-size:32px;font-weight:500;fill:#3e596d}
#scene .normal{font-size:32px;font-weight:700}
#scene .number{font-size:32px;font-weight:700}
#scene .title{font-size:34px;font-weight:750}
@media(min-width:1600px){
 :root{--classroom-type:26px;--classroom-value:34px;--classroom-title:30px}
 .workspace{grid-template-columns:380px minmax(0,1fr);gap:20px}
 .wheelzone svg{max-height:330px}.assistRow button{min-width:142px}
}


/* Grouped classroom controls: no type reduction, no change to animations. */
.dashboard{display:grid;grid-template-rows:minmax(340px,1fr) auto auto;gap:10px;align-content:stretch;padding-right:16px}
.steering-controls{min-width:0;min-height:340px;display:flex;flex-direction:column;gap:6px}
.steering-heading{flex:none;min-width:0}.steering-heading label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;font-size:var(--classroom-type);font-weight:700;line-height:1.12}

.steering-controls .wheelzone{flex:1 1 180px;min-height:122px;padding:0;overflow:hidden}.steering-controls .wheelzone svg{max-height:320px}
.steering-controls .rangebox{flex:none;gap:3px;padding:0 3px}.steering-controls .rangebox input{width:100%;height:26px}.steering-controls .limits{font-size:var(--classroom-type);line-height:1.05}
.steering-controls .quick{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"left right" "centre centre";gap:8px}
.steering-controls .quick button{font-size:var(--classroom-type);line-height:1.12;min-height:44px;padding:5px 2px;border-radius:8px;border-color:#cbd8e5;font-weight:650;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.steering-controls .quick button[data-angle="-450"]{grid-area:left}.steering-controls .quick button[data-angle="450"]{grid-area:right}
.steering-controls .quick button[data-angle="0"]{grid-area:centre;grid-column:auto;grid-row:auto;background:#f3f6fa;border-color:#d5e0ea}.steering-controls .quick button:hover{background:#eaf2fd;border-color:#98b9dd}
.motor-controls{min-width:0;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:10px}.motor-controls .architecture{border:0;padding:0}
.motor-controls .setting-title{font-size:var(--classroom-type);font-weight:650;line-height:1.12;margin:0 0 6px}
.motor-controls .choicebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:3px;background:#f1f5f9;border:1px solid #d6e1eb;border-radius:9px;min-height:46px}
.motor-controls .choicebar button{font-size:var(--classroom-type);line-height:1.12;padding:4px;border:1px solid transparent;border-radius:6px;min-width:0;background:transparent;font-weight:650}
.motor-controls .choicebar button[aria-pressed=true]{background:white;color:#0a58bf;border-color:#b9cfe7;box-shadow:0 1px 3px #15375414}.motor-controls .choicebar button:hover{color:#0a58bf;background:#e8f0fa}
.motor-controls .assistRow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:0}.motor-controls .assistRow strong{font-size:var(--classroom-type);line-height:1.12;font-weight:650;white-space:nowrap}
.motor-controls .assistRow button{position:relative;width:100%;min-width:0;min-height:44px;padding:5px 65px;font-size:var(--classroom-type);line-height:1.12;border-radius:8px;background:#edf4fd;color:#0a58bf;border-color:#bad0e9;font-weight:750;transition:background-color .15s,color .15s}
.motor-controls .assistRow button::before{content:"";position:absolute;left:15px;top:50%;width:10px;height:10px;border-radius:50%;transform:translateY(-50%);background:#2f7aa6}
.motor-controls .assistRow button::after{content:"";position:absolute;right:14px;top:50%;width:38px;height:22px;border-radius:12px;transform:translateY(-50%);background:radial-gradient(circle at 27px 11px,#fff 0 7px,transparent 7.6px),#2869a3}
.motor-controls .assistRow button[aria-pressed=false]{background:#f3f5f7;color:#4a5c6c;border-color:#cbd6df}.motor-controls .assistRow button[aria-pressed=false]::before{background:#8c9eab}
.motor-controls .assistRow button[aria-pressed=false]::after{background:radial-gradient(circle at 11px 11px,#fff 0 7px,transparent 7.6px),#94a4b2}
.dashboard .legend{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:0;margin:0;font-size:var(--classroom-type);line-height:1.12;color:var(--muted)}.dashboard .legend span{display:flex;align-items:center;gap:8px;white-space:nowrap}.dashboard .legend i{flex:none;width:22px;height:4px;border-radius:2px;margin:0}
@media(prefers-reduced-motion:reduce){.motor-controls .assistRow button{transition:none}}
@media(min-width:1600px){.steering-controls .wheelzone svg{max-height:350px}.dashboard{grid-template-rows:minmax(352px,1fr) auto auto}.steering-controls{min-height:352px}}


/* A single navigation strip anchored to the animation pane. */
main{grid-template-rows:minmax(0,1fr);gap:0}
.viewer{grid-template-rows:64px minmax(0,1fr) 140px;gap:12px}
.viewhead{padding:0;min-height:0;display:block}
.viewhead .tabs{height:64px;width:100%;display:grid;grid-template-columns:1fr 1.65fr;gap:4px;align-items:stretch;margin:0;padding:4px;border:1px solid #cbd9e6;border-radius:11px;background:#eaf0f6}
.viewhead .tab{height:54px;min-height:0;display:flex;align-items:center;justify-content:center;gap:11px;padding:4px 12px;border:1px solid transparent;border-radius:8px;color:#3b536b;background:transparent;font-size:var(--classroom-type);line-height:1.12;box-shadow:none;white-space:nowrap}
.viewhead .tab b{display:flex;align-items:center;justify-content:center;flex:none;min-width:42px;height:38px;border-radius:6px;font-size:var(--classroom-title);font-variant-numeric:tabular-nums;background:#dce6f0;color:#315370}
.viewhead .tab span{font-weight:700}.viewhead .tab:hover{background:#dfe9f3}
.viewhead .tab[aria-selected=true]{background:#173d63;border-color:#173d63;color:white;box-shadow:0 1px 3px #12385522}
.viewhead .tab[aria-selected=true] b{background:#ffffff20;color:white}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* One degree readout, only in the lower card. */
.steering-heading label{min-height:32px;justify-content:flex-start;font-size:var(--classroom-type)}
.steering-controls .quick button[data-angle="0"]{grid-area:centre;width:min(76%,270px);justify-self:center;grid-column:auto;grid-row:auto;padding-inline:10px}
/* Separate readout cards with fixed large classroom typography. */
.readout{height:140px;min-height:0;display:grid;grid-template-columns:1.1fr 1.5fr 1.45fr 1.75fr;gap:10px;border:0;padding:0;align-items:stretch}
.readout .metric{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px;padding:12px 8px 10px;border:1px solid #d4e0eb;border-radius:10px;background:#f7f9fc;align-items:center;overflow:visible}
.readout .metric::before{content:"";position:absolute;top:0;left:13px;right:13px;height:3px;border-radius:0 0 3px 3px;background:#a9bdcf}
.readout .metric:first-child::before{background:#2d78bd}.readout .metric:nth-child(4)::before{background:#be8648}
.readout .metric small{font-size:var(--classroom-type);font-weight:500;line-height:1.12;margin:0;color:#496379;white-space:nowrap;align-self:start}
.readout .metric strong{font-size:var(--classroom-value);font-weight:750;line-height:1.12;margin:0;align-self:center;white-space:nowrap}
.readout .metric strong.wheel-values{white-space:pre-line}
@media print{main{display:block}.viewhead .tabs{display:none!important}.viewer{grid-template-rows:0 minmax(0,1fr) 140px}.readout{height:140px}}


/* Only the centralization shortcut remains. */
.steering-controls .quick{grid-template-columns:minmax(0,1fr);grid-template-areas:"centre";gap:0}
.steering-controls .quick button[data-angle="0"]{grid-area:centre;grid-column:1;grid-row:1;justify-self:center}

/* Electronic diagram: centered text blocks and softer card edges. */
#scene .diagram-title{font-size:24px;font-weight:650;fill:#25415a;letter-spacing:.15px}
#scene .diagram-detail{font-size:24px;font-weight:500;fill:#587085;font-variant-numeric:tabular-nums}
#scene .diagram-heading{font-size:26px;font-weight:600;fill:#294960}
#scene .diagram-status{font-size:21px;font-weight:600;fill:#765b39}
#scene[data-assist=off] .diagram-status{fill:#60778a}
#scene .diagram-note-title{font-size:22px;font-weight:600;fill:#36566e}
#scene .diagram-note{font-size:22px;font-weight:400;fill:#5b7286}
#scene .diagram-mechanical{stroke:#8b9fad;stroke-width:2.3;fill:none}
/* Footer indicators: one centered axis for title and value in every card. */
.readout .metric{grid-template-rows:32px minmax(0,1fr);gap:6px;padding:10px 8px;border-color:#d9e3ec;border-radius:12px;background:#fff;box-shadow:0 2px 6px #173d6308;text-align:center;justify-items:center;align-items:center}
.readout .metric::before{display:none}
.readout .metric small{width:100%;text-align:center;align-self:center;margin:0;line-height:1.12;color:#526b80}
.readout .metric strong{width:100%;text-align:center;align-self:center;margin:0;line-height:1.15;font-variant-numeric:tabular-nums}
.readout .metric strong.wheel-values{white-space:pre-line}


/* Wheel angles: two balanced side-by-side readings, using the slide palette. */
.readout{grid-template-columns:minmax(128px,1fr) minmax(352px,1.8fr) minmax(168px,1.15fr) minmax(200px,1.35fr)}
.readout .metric.wheel-card{padding-inline:6px}
.readout .wheel-card .wheel-values{position:relative;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:center;align-self:center;min-width:0}
.readout .wheel-card .wheel-values::after{content:"";position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:#dce5ed;transform:translateX(-50%);pointer-events:none}
.readout .wheel-card .wheel-reading{min-width:0;display:flex;align-items:baseline;justify-content:center;gap:5px;white-space:nowrap}
.readout .wheel-card .wheel-side{font-size:var(--classroom-type);line-height:1.15;font-weight:600;color:#526b80;flex:none}
.readout .wheel-card strong.wheel-angle-value{width:auto;margin:0;align-self:auto;font-size:var(--classroom-value);line-height:1.15;font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:0}

}

/* Compact electronic diagram: greater whitespace, slimmer connections. */
#scene .logic-signal{stroke:#6d91ab;stroke-width:1.8;fill:none}

const elementCache=new Map();const $=id=>{if(!elementCache.has(id))elementCache.set(id,document.getElementById(id));return elementCache.get(id);};
const tabs=Array.from(document.querySelectorAll('.tab'));
const S={view:1,angle:0,arch:'rack',assist:true,motorSpin:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),q=v=>Math.round(v*10)/10;
const fmtAngle=v=>(Math.abs(v)<.05?'0':(v>0?'+':'')+q(v).toString().replace('.',','))+'°';
const direction=()=>S.angle>2?'direita':S.angle< -2?'esquerda':'centro';
const ARM_R=64, ROD_R=Math.hypot(64,4);
function wheelLink(kingpinX,kingpinY,rackJointX,rackJointY){
 const vx=rackJointX-kingpinX,vy=rackJointY-kingpinY,d=Math.hypot(vx,vy);
 const along=(d*d+ARM_R*ARM_R-ROD_R*ROD_R)/(2*d);
 const across=Math.sqrt(Math.max(0,ARM_R*ARM_R-along*along));
 const candidates=[-1,1].map(sign=>{
  const x=kingpinX+along*vx/d+sign*across*(-vy/d);
  const y=kingpinY+along*vy/d+sign*across*(vx/d);
  return {angle:Math.atan2(-(x-kingpinX),y-kingpinY)*180/Math.PI,tip:{x,y}};
 });
 // This model covers the physically continuous solution near straight ahead.
 return candidates.reduce((a,b)=>Math.abs(a.angle)<Math.abs(b.angle)?a:b);
}
function linkage(a, wheelX=[345,655], rackX=[409,591], wheelY=242, rackY=310){
 const dx=-32*a/450;
 const innerLeft={x:rackX[0]+dx,y:rackY},innerRight={x:rackX[1]+dx,y:rackY};
 const l=wheelLink(wheelX[0],wheelY,innerLeft.x,rackY);
 const r=wheelLink(wheelX[1],wheelY,innerRight.x,rackY);
 return {left:l.angle,right:r.angle,outerLeft:l.tip,outerRight:r.tip,innerLeft,innerRight,dx};
}
function steering(a){return linkage(a)}

// One rack/pinion pitch relationship is used throughout the drawing and zoom.
const PINION_R=32/(450*Math.PI/180),TOOTH_COUNT=20,GEAR_MODULE=2*PINION_R/TOOTH_COUNT,TOOTH_PITCH=Math.PI*GEAR_MODULE;
const PRESSURE_ANGLE=20*Math.PI/180,BASE_R=PINION_R*Math.cos(PRESSURE_ANGLE),TIP_R=PINION_R+GEAR_MODULE,ROOT_R=PINION_R-1.25*GEAR_MODULE;
const GEAR_BACKLASH=.04*GEAR_MODULE;
// Generic standard involute/rack illustration, not vehicle calibration data.

const visual={angle:0};let frameRequest=0,sceneKey='',motion=null,transition=null,pageFitQueued=false,toastTimer=0;
function values(){const a=visual.angle,s=steering(a);return{a,s,rack:s.dx};}

const assistModel={lastAngle:0,moving:false,direction:1,speed:0,timer:0,load:0,manual:0,electric:0};
function updateAssistModel(a){
 const delta=a-assistModel.lastAngle;
 if(Math.abs(delta)>.002){
  assistModel.moving=true;assistModel.direction=delta>0?1:-1;
  assistModel.speed=clamp(Math.abs(delta)/14,0,1);
  clearTimeout(assistModel.timer);
  assistModel.timer=setTimeout(()=>{
   assistModel.timer=0;assistModel.moving=false;assistModel.speed=0;requestRender();
  },220);
 }
 assistModel.lastAngle=a;
 // Relative visual load assumes generic tyre resistance, including an
 // illustrative holding load away from centre. Values are not Nm or EPAS
 // calibration and cannot reproduce physical resistance in a mouse.
 const deflection=Math.abs(a)/450;
 const load=clamp((assistModel.moving?.46:.18)+.39*deflection+.12*assistModel.speed,.18,1);
 const share=S.assist?.70:0;
 assistModel.load=load;assistModel.manual=load*(1-share);assistModel.electric=load*share;
 return assistModel;
}

 const n=9,step=(end-start)/n,p=[`M${start} ${y-5.9}`];
 for(let i=0;i<n;i++){const x=start+i*step;p.push(`L${x+step*.12} ${y-6.4}Q${x+step*.20} ${y-6.7} ${x+step*.24} ${y-10.3}Q${x+step*.5} ${y-13.4} ${x+step*.76} ${y-10.3}Q${x+step*.80} ${y-6.7} ${x+step*.88} ${y-6.4}`);}
 p.push(`L${end} ${y-5.9}V${y+5.9}`);
 for(let i=n-1;i>=0;i--){const x=start+i*step;p.push(`L${x+step*.88} ${y+6.4}Q${x+step*.80} ${y+6.7} ${x+step*.76} ${y+10.3}Q${x+step*.5} ${y+13.4} ${x+step*.24} ${y+10.3}Q${x+step*.20} ${y+6.7} ${x+step*.12} ${y+6.4}`);}
 return p.join(' ')+`L${start} ${y+5.9}Z`;
}

function involute(angle){return Math.tan(angle)-angle;}
function flankHalfAngle(radius){
 const local=Math.acos(clamp(BASE_R/radius,-1,1));
 return Math.PI/(2*TOOTH_COUNT)-GEAR_BACKLASH/(2*PINION_R)+involute(PRESSURE_ANGLE)-involute(local);
}
let gearContourCache=null;
function gearPoints(){
 if(gearContourCache)return gearContourCache;
 const points=[],step=2*Math.PI/TOOTH_COUNT;
 const point=(r,a)=>points.push([r*Math.cos(a),r*Math.sin(a)]);
 for(let tooth=0;tooth<TOOTH_COUNT;tooth++){
  const center=Math.PI/2+tooth*step,baseHalf=flankHalfAngle(BASE_R),tipHalf=flankHalfAngle(TIP_R);
  for(let i=0;i<5;i++)point(ROOT_R,center-step/2+(step/2-baseHalf)*i/4);
  for(let i=0;i<=22;i++){const r=BASE_R+(TIP_R-BASE_R)*i/22;point(r,center-flankHalfAngle(r));}
  for(let i=1;i<=8;i++)point(TIP_R,center-tipHalf+2*tipHalf*i/8);
  for(let i=1;i<=22;i++){const r=TIP_R-(TIP_R-BASE_R)*i/22;point(r,center+flankHalfAngle(r));}
  for(let i=0;i<5;i++)point(ROOT_R,center+baseHalf+(step/2-baseHalf)*i/4);
 }
 gearContourCache=points;return points;
}
function pointsPath(points){return 'M'+points.map(p=>p.map(v=>v.toFixed(6)).join(' ')).join('L')+'Z';}
function gearOutline(cx,cy){return pointsPath(gearPoints().map(p=>[p[0]+cx,p[1]+cy]));}
function rackPoints(cx=500,pitchY=303,count=43){
 const points=[],m=GEAR_MODULE,rootY=pitchY+1.25*m,tipY=pitchY-m;
 const halfRoot=TOOTH_PITCH/4+1.25*m*Math.tan(PRESSURE_ANGLE)-GEAR_BACKLASH/2;
 const halfTip=TOOTH_PITCH/4-m*Math.tan(PRESSURE_ANGLE)-GEAR_BACKLASH/2;
 const start=cx+(-count+.5)*TOOTH_PITCH-TOOTH_PITCH/2,end=cx+(count+.5)*TOOTH_PITCH+TOOTH_PITCH/2;
 points.push([start,rootY]);
 for(let i=-count;i<=count;i++){
  const x=cx+(i+.5)*TOOTH_PITCH;
  points.push([x-halfRoot,rootY],[x-halfTip,tipY],[x+halfTip,tipY],[x+halfRoot,rootY]);
 }
 points.push([end,rootY],[end,pitchY+3.6*m],[start,pitchY+3.6*m]);return points;
}
function rackTeeth(cx=500,pitchY=303,count=43){return pointsPath(rackPoints(cx,pitchY,count));}
function rackSurface(cx=500,pitchY=303,count=43){
 const outline=rackTeeth(cx,pitchY,count),m=GEAR_MODULE;
 return `<path data-rack-teeth="true" d="${outline}" fill="url(#rackFace)" stroke="#5c7484" stroke-width="${m*.035}" stroke-linejoin="round"/>
 <path d="${outline}" fill="none" stroke="#f3f6f8" stroke-opacity=".65" stroke-width="${m*.055}"/>
 <path d="M${cx-(count-.5)*TOOTH_PITCH} ${pitchY+2.4*m}H${cx+(count-.5)*TOOTH_PITCH}" stroke="#e3e9ee" opacity=".5" stroke-width="${m*.09}"/>`;
}
function pinion(cx=500,cy=303-PINION_R){
 const r=PINION_R,m=GEAR_MODULE,outline=gearOutline(cx,cy);
 let machining='';
 for(let tooth=0;tooth<TOOTH_COUNT;tooth++){
  const angle=Math.PI/2+tooth*2*Math.PI/TOOTH_COUNT,left=angle-flankHalfAngle((r+TIP_R)/2)*.8;
  machining+=`M${cx+(r*.89)*Math.cos(left)} ${cy+(r*.89)*Math.sin(left)}L${cx+(TIP_R-m*.23)*Math.cos(left)} ${cy+(TIP_R-m*.23)*Math.sin(left)}`;
 }
 return `<g data-pinion="true" data-cx="${cx}" data-cy="${cy}" data-gear-profile="involute" data-tooth-count="${TOOTH_COUNT}" data-module="${m}">
 <path d="${outline}" fill="#657e8d" stroke="#3f5969" stroke-width="${m*.10}"/>

}

 const top=y+(h-th-dh-10)/2+(String(title).startsWith('PINHÃO')?3:0);
 return `<g data-diagram-node="true">
 <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#ffffff" stroke="#d2dee8" stroke-width="1.1"/>
 <path d="M${x+w/2-15} ${y+3}H${x+w/2+15}" stroke="${accent}" stroke-width="2" stroke-linecap="round" opacity=".5"/>
 ${svgTextLines(x+w/2,top+19,title,'diagram-title')}
 ${svgTextLines(x+w/2,top+th+10+19,desc,'diagram-detail')}
 </g>`;
}
function sceneLogic(v){
 const active=S.assist,ux=v.rack;
 const rackPosition=Math.abs(ux)<.001?'Centro':(ux>0?'→ ':'← ')+Math.abs(ux).toFixed(1).replace('.',',');
 const steerDirection=direction().charAt(0).toUpperCase()+direction().slice(1);
 return `${sceneDefs()}
 <defs>
 <marker id="logicSignalArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L7 4L1 7" fill="none" stroke="#6d91ab" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="logicTorqueArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L7 4L1 7" fill="none" stroke="${active?'#b48a57':'#9eafbb'}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
 </defs>
 <g data-diagram-header="true">
 <rect x="50" y="40" width="580" height="46" rx="9" fill="#f7f9fb" stroke="#d5e0e9" stroke-width="1"/>
 ${svgTextLines(340,70,'02 · Controle e sinais','diagram-heading')}
 <rect x="690" y="40" width="260" height="46" rx="9" fill="${active?'#fcf6ed':'#f3f6f8'}" stroke="${active?'#e2d2bc':'#d5e0e9'}" stroke-width="1"/>
 ${svgTextLines(820,69,active?'Assistência ativa':'Assistência inativa','diagram-status')}
 </g>
 <g data-diagram-connections="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M180 234V276M180 386V428" class="logic-signal" marker-end="url(#logicSignalArrow)"/>
 <path d="M310 483H350V331H370" class="logic-signal" marker-end="url(#logicSignalArrow)"/>
 <path d="M630 331H660V179H690" class="logic-torque ${active?'':'logic-inactive'}" marker-end="url(#logicTorqueArrow)"/>
 <path d="M820 234V276M820 386V428" class="logic-signal" marker-end="url(#logicSignalArrow)"/>
 <path d="M310 331H330V552H675V331H690" class="diagram-mechanical"/>
 </g>
 ${box(50,124,260,110,'VOLANTE',fmtAngle(S.angle)+'\n'+steerDirection)}
 ${box(50,276,260,110,'COLUNA','Transmite o giro')}
 ${box(50,428,260,110,'SENSOR DE\nTORQUE',direction()==='centro'?'Centro':'Sentido: '+(direction()==='esquerda'?'←':'→'))}
 ${box(370,276,260,110,'PSCM','Comanda a\nassistência','#b99567')}
 ${box(690,124,260,110,'MOTOR\nELÉTRICO',active?'Habilitado':'Desligado',active?'#b99567':'#9cadba')}
 ${box(690,276,260,110,'PINHÃO →\nCREMALHEIRA',rackPosition)}
 ${box(690,428,260,110,'RODAS','E '+fmtAngle(v.s.left)+'\nD '+fmtAngle(v.s.right))}
 <g data-diagram-footer="true">
 <rect x="50" y="568" width="900" height="60" rx="9" fill="#f5f8fb" stroke="#d5e0e9" stroke-width="1"/>
 ${svgTextLines(500,592,'Ligação mecânica: volante → coluna → rodas.','diagram-note-title')}
 ${svgTextLines(500,616,'A assistência reduz o esforço, não o esterçamento.','diagram-note')}
 </g>`;
}

function collectMotion(){
 const find=q=>Array.from($('scene').querySelectorAll(q));
 motion={wheels:find('[data-front-wheel]'),arms:find('[data-arm]'),rods:find('[data-rod]'),balls:find('[data-ball]'),inners:find('[data-inner]'),boots:find('[data-boot]'),racks:find('[data-rack-moving]'),pinions:find('[data-pinion]'),inputs:find('[data-input-wheel]'),rotors:find('[data-rotor]'),stripes:find('[data-shaft-stripe]'),universals:find('[data-universal]'),belts:find('[data-belt]'),nuts:find('[data-nut-mark]'),worms:find('[data-worm]'),leds:find('[data-assist-led]'),bootRibs:find('[data-boot-ribs]'),bootCollars:find('[data-boot-collars]'),fittings:find('[data-rod-fitting]'),motorHalos:find('[data-motor-halo]'),motorRings:find('[data-motor-active-ring]'),stators:find('[data-stator]'),electricPaths:find('[data-electric-path]'),assistVectors:find('[data-assist-vector]'),inputLoads:find('[data-input-load]')};
}
function updateScene(v){
 const k=v.s,rad=v.a*Math.PI/180;
 for(const node of motion.wheels)node.setAttribute('transform',`rotate(${node.dataset.frontWheel==='L'?k.left:k.right})`);
 for(const node of motion.arms){const right=node.dataset.arm==='R',p=right?k.outerRight:k.outerLeft;node.setAttribute('d',`M${right?655:345} 242L${p.x.toFixed(5)} ${p.y.toFixed(5)}`);}
 for(const node of motion.rods){const right=node.dataset.rod==='R',p=right?k.outerRight:k.outerLeft,b=right?k.innerRight:k.innerLeft;node.setAttribute('d',`M${b.x.toFixed(5)} ${b.y.toFixed(5)}L${p.x.toFixed(5)} ${p.y.toFixed(5)}`);}
 for(const node of motion.balls){const p=node.dataset.ball==='R'?k.outerRight:k.outerLeft;node.setAttribute('transform',`translate(${p.x} ${p.y})`);}
 for(const node of motion.inners){const p=node.dataset.inner==='R'?k.innerRight:k.innerLeft;node.setAttribute('transform',`translate(${p.x} ${p.y})`);}
 for(const node of motion.boots)node.setAttribute('d',node.dataset.boot==='L'?bootPath(k.innerLeft.x+3,458):bootPath(542,k.innerRight.x-3));

 for(const node of motion.bootRibs){const left=node.dataset.bootRibs==='L';node.setAttribute('d',left?bootHighlights(k.innerLeft.x+3,458):bootHighlights(542,k.innerRight.x-3));}
 for(const node of motion.bootCollars){const left=node.dataset.bootCollars==='L';node.setAttribute('d',left?bootCollars(k.innerLeft.x+3,458):bootCollars(542,k.innerRight.x-3));}
 for(const node of motion.fittings){const right=node.dataset.rodFitting==='R',outer=right?k.outerRight:k.outerLeft,inner=right?k.innerRight:k.innerLeft;const angle=Math.atan2(inner.y-outer.y,inner.x-outer.x)*180/Math.PI;node.setAttribute('transform',`translate(${outer.x} ${outer.y}) rotate(${angle})`);}
 for(const node of motion.racks)node.setAttribute('transform',`translate(${k.dx} 0)`);
 for(const node of motion.pinions)node.setAttribute('transform',`rotate(${v.a} ${node.dataset.cx} ${node.dataset.cy})`);
 for(const node of motion.inputs)node.setAttribute('transform',`rotate(${v.a})`);
 // A coupled transmission can be back-driven with assistance off. The LED
 // indicates electrical torque availability, not a fictitious disconnect.
 const nutAngle=k.dx/16*360;
 for(const node of motion.rotors){const spin=node.dataset.rotor==='rack'?nutAngle*2:v.a*12;node.setAttribute('transform',`rotate(${spin%360})`);}
 for(const node of motion.stripes){const x=Number(node.dataset.x)+3.4*Math.sin(rad);node.setAttribute('d',`M${x} ${node.dataset.top}V${node.dataset.bottom}`);node.setAttribute('opacity',String(.3+.45*(.5+.5*Math.cos(rad))));}
 for(const node of motion.universals)node.setAttribute('transform',`scale(${.48+.52*Math.abs(Math.cos(rad))} 1)`);
 for(const node of motion.belts)node.setAttribute('stroke-dashoffset',String(nutAngle/360*16));
 for(const node of motion.nuts)node.setAttribute('d',`M${533+3*Math.sin(nutAngle*Math.PI/180)} 301V320`);
 for(const node of motion.worms){const phase=v.a*12*Math.PI/180,points=[];for(let i=0;i<=48;i++){const x=469+i*.5,y=235+4.5*Math.sin((x-469)/6*Math.PI*2+phase);points.push((i?'L':'M')+x.toFixed(3)+' '+y.toFixed(3));}node.querySelector('path').setAttribute('d',points.join(' '));}
 for(const node of motion.leds)node.setAttribute('fill',S.assist?'#ba7d37':'#95a4af');
}

function updateAssistVisual(v){
 const m=assistModel,enabled=S.assist,holding=Math.abs(v.a)>2;
 const state=!enabled?'off':m.moving?'working':holding?'holding':'ready';
 const scene=$('scene');scene.setAttribute('data-assist',enabled?'on':'off');
 scene.setAttribute('data-assist-state',state);scene.setAttribute('data-steering-moving',String(m.moving));
 scene.setAttribute('data-steering-direction',m.direction>0?'right':'left');
 if(motion){
  const intensity=enabled?(m.moving?.64+.36*m.electric:holding?.40:.15):0;
  for(const node of motion.motorHalos)node.setAttribute('opacity',String(intensity*.40));
  for(const node of motion.motorRings){node.setAttribute('opacity',String(enabled?(m.moving?.94:holding?.66:.34):0));node.setAttribute('stroke-width',String(enabled?(m.moving?2.8:1.7):1));}
  for(const node of motion.stators)node.setAttribute('opacity',enabled?'1':'.30');
  for(const node of motion.electricPaths)node.setAttribute('opacity',enabled&&(m.moving||holding)?'1':'0');
  for(const node of motion.assistVectors){
   if(S.arch==='rack'){
    const direction=m.moving?-m.direction:Math.sign(v.s.dx)||-1;
    const start=534,end=start+direction*22;
    node.setAttribute('d',`M${start} 310H${end}M${end-direction*4} 306L${end} 310L${end-direction*4} 314`);
   }else{
    const d=m.moving?m.direction:Math.sign(v.a)||1;
    node.setAttribute('d',d>0?'M486 246A14 14 0 0 1 514 246M510 242L514 246L518 242':'M514 246A14 14 0 0 0 486 246M482 242L486 246L490 242');
   }
  }
  for(const node of motion.inputLoads){node.setAttribute('opacity',String(.18+.68*m.manual));node.setAttribute('stroke-width',String(.8+3.8*m.manual));}
 }
 $('driverTorqueRing').setAttribute('opacity',String(enabled?.22:.68));
 $('driverTorqueRing').setAttribute('stroke-width',String(enabled?2.2:5.2));
 $('driverTorqueRing').setAttribute('stroke-dasharray',`${enabled?24:66} ${enabled?43:17}`);
 $('driverTorqueRing').setAttribute('transform',`rotate(${v.a} 180 164)`);
 $('driverTorqueRing').setAttribute('data-effort',enabled?'reduced':'increased');
 $('mMotor').textContent=!enabled?'Desligada':m.moving?'Ajudando':holding?'Mantendo':'Pronta';
 $('mMotor').setAttribute('title',!enabled?'Sem torque elétrico; a transmissão permanece mecanicamente conectada.':m.moving?'Motor somando torque na transmissão.':holding?'Torque de sustentação ilustrativo sob a carga assumida no modelo.':'Assistência disponível; sem movimento ou carga de sustentação nesta posição.');
}

function updateControls(v){
 const a=v.a;$('wheelSpin').setAttribute('transform',`rotate(${a} 180 164)`);$('wheelControl').setAttribute('aria-valuenow',String(q(a)));$('wheelControl').setAttribute('aria-valuetext',a===0?'centralizado':`${Math.abs(q(a))} graus para a ${a>0?'direita':'esquerda'}`);
 $('angleSlider').value=q(a);$('mWheel').textContent=fmtAngle(a);$('mTireLeft').textContent=fmtAngle(v.s.left);$('mTireRight').textContent=fmtAngle(v.s.right);$('mRack').textContent=Math.abs(v.rack)<.001?'Centro':(v.rack>0?'→ ':'← ')+Math.round(Math.abs(v.rack)/32*100)+'%';$('mMotor').textContent=S.assist?'Ligada':'Desligada';
 $('assistButton').textContent=S.assist?'Ligada':'Desligada';$('assistButton').setAttribute('aria-pressed',String(S.assist));$('assistButton').classList.toggle('off',!S.assist);
 $('viewTitle').textContent=({1:'Mecânica da direção',2:'Controle eletrônico'})[S.view];$('viewContext').textContent=S.view<2?'':'Sinais e assistência';
 $('scene').setAttribute('aria-label',`Vista ${S.view}: direção ${a>2?'direita':a< -2?'esquerda':'centralizada'}, volante ${q(a)} graus; rodas ${q(v.s.left)} e ${q(v.s.right)} graus; assistência ${S.assist?'ligada':'desligada'}. Modelo ilustrativo.`);
 tabs.forEach(t=>t.setAttribute('aria-selected',String(S.view===Number(t.dataset.view))));
 document.querySelectorAll('[data-architecture]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.architecture===S.arch)));
}
function paint(){
 const v=values(),key=S.view+'|'+S.arch;updateAssistModel(v.a);
 if(S.view===2){$('scene').innerHTML=sceneLogic(v);sceneKey=key;motion=null;}
 else{if(sceneKey!==key||!motion){$('scene').innerHTML=sceneGear();sceneKey=key;collectMotion();}updateScene(v);}
 updateControls(v);updateAssistVisual(v);
}
function requestRender(){if(!frameRequest)frameRequest=requestAnimationFrame(renderFrame);}
function renderFrame(time){frameRequest=0;
 if(transition){if(transition.started===null)transition.started=time;const t=clamp((time-transition.started)/180,0,1),e=1-Math.pow(1-t,3);visual.angle=transition.from+(transition.to-transition.from)*e;if(t>=1){visual.angle=transition.to;transition=null;}}
 paint();if(transition)requestRender();
}
function move(a,smooth=false){
 const value=q(clamp(Number(a),-450,450));if(!Number.isFinite(value))return;S.angle=value;
 if(smooth&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches)transition={from:visual.angle,to:value,started:null};
 else{transition=null;visual.angle=value;}requestRender();
}
function fitPage(){
 const shell=$('appShell'),width=Math.max(1,Math.min(document.documentElement.clientWidth||window.innerWidth,window.visualViewport?window.visualViewport.width:window.innerWidth)),height=Math.max(1,window.visualViewport?Math.min(window.visualViewport.height,window.innerHeight):window.innerHeight);
 let minHeight=660;
 for(let attempt=0;attempt<5;attempt++){
  const scale=Math.min(1,width/1140,height/minHeight);shell.style.width=width/scale+'px';shell.style.height=height/scale+'px';shell.style.transform='scale('+scale+')';shell.dataset.scale=String(scale);
  let overflow=0;for(const selector of ['.dashboard','.viewer','.readout','.tabs']){const panel=document.querySelector(selector);if(panel)overflow=Math.max(overflow,panel.scrollHeight-panel.clientHeight);}
  if(overflow<=1)break;minHeight=Math.max(minHeight,height/scale+overflow+8);
 }
}
function scheduleFit(){if(pageFitQueued)return;pageFitQueued=true;requestAnimationFrame(()=>{pageFitQueued=false;fitPage();});}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
$('angleSlider').addEventListener('input',e=>move(e.target.value));
document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.angle,true)));
$('architectures').addEventListener('click',e=>{const b=e.target.closest('[data-architecture]');if(b){S.arch=b.dataset.architecture;requestRender();}});
$('assistButton').addEventListener('click',()=>{S.assist=!S.assist;requestRender();});
tabs.forEach(b=>b.addEventListener('click',()=>{S.view=Number(b.dataset.view);requestRender();}));
const wheel=$('wheelControl');let tracking=false,lastPolar=0,dragAngle=0;
function polar(e){const p=wheel.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const local=p.matrixTransform(wheel.getScreenCTM().inverse());return Math.atan2(local.y-164,local.x-180)*180/Math.PI;}
wheel.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;transition=null;tracking=true;lastPolar=polar(e);dragAngle=visual.angle;wheel.setPointerCapture(e.pointerId);e.preventDefault();});
wheel.addEventListener('pointermove',e=>{if(!tracking)return;const next=polar(e),delta=((next-lastPolar+540)%360)-180;lastPolar=next;dragAngle=clamp(dragAngle+delta,-450,450);move(dragAngle);e.preventDefault();});
function release(e){tracking=false;if(e&&wheel.hasPointerCapture(e.pointerId))wheel.releasePointerCapture(e.pointerId);}
wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);wheel.addEventListener('lostpointercapture',()=>{tracking=false;});
wheel.addEventListener('keydown',e=>{const step=e.shiftKey?30:10;if(['ArrowLeft','ArrowDown'].includes(e.key)){move(S.angle-step);e.preventDefault();}else if(['ArrowRight','ArrowUp'].includes(e.key)){move(S.angle+step);e.preventDefault();}else if(e.key==='Home'){move(0,true);e.preventDefault();}else if(e.key==='End'){move(450,true);e.preventDefault();}});
window.addEventListener('resize',scheduleFit);window.addEventListener('orientationchange',scheduleFit);if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleFit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleFit);
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';scheduleFit();});
$('fullscreenButton').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('appShell').requestFullscreen)await $('appShell').requestFullscreen();else toast('Tela cheia indisponível neste navegador.');}catch(e){toast('Não foi possível ativar a tela cheia.');}scheduleFit();});
$('printButton').addEventListener('click',()=>{transition=null;visual.angle=S.angle;paint();$('printMeta').textContent='Direção elétrica assistida · '+(S.arch==='rack'?'motor na caixa':'motor na coluna')+' · volante '+fmtAngle(S.angle)+' · Modelo ilustrativo, sem dados de calibração.';window.print();});
fitPage();paint();
</script></body></html>
